<div class="workbench-shell" id="workbench-shell" hidden>
    <aside class="workbench-rail" aria-label="Быстрая навигация">
        <div class="workbench-rail__brand" title="Omni">◈</div>
        <button class="workbench-rail__item workbench-rail__item--active" type="button" data-workbench-tab="console" title="Плагины" aria-label="Плагины"><span aria-hidden="true">▦</span></button>
        <button class="workbench-rail__item" type="button" data-workbench-tab="task-manager" title="Задачи" aria-label="Задачи"><span aria-hidden="true">⌘</span></button>
        <button class="workbench-rail__item" type="button" data-workbench-tab="catalog" title="Каталог" aria-label="Каталог"><span aria-hidden="true">⬡</span></button>
        <div class="workbench-rail__spacer"></div>
        <button class="workbench-rail__item" type="button" data-workbench-tab="appearance" title="Темы" aria-label="Темы"><span aria-hidden="true">◐</span></button>
    </aside>
    <main class="workbench-main">
        <header class="workbench-main__header" id="workbench-header"></header>
        <div class="workbench-main__tabs" id="workbench-tabs"></div>
        <section class="workbench-main__stage" id="workbench-stage"></section>
    </main>
</div>

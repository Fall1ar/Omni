<div class="app" id="classic-shell" hidden>
        <!-- Header -->
        <header class="header">
            <div class="header__logo">
                <span class="header__icon">◈</span>
                <h1 class="header__title">Omni</h1>
                <span class="header__badge">v0.1.2</span>
            </div>
            <div class="header__actions">
                <button id="btn-task-manager" class="btn btn--ghost" title="Диспетчер задач">
                    <svg class="btn__icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                </button>
                <button id="btn-plugin-hub" class="btn btn--ghost" title="Plugin Hub">Hub</button>
                <button id="btn-refresh" class="btn btn--ghost" title="Refresh plugins">
                    <span class="btn__icon">↻</span>
                </button>
                <button id="btn-theme-settings" class="btn btn--ghost" type="button" title="Настройки темы" aria-label="Настройки темы">
                    <svg class="btn__icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.7 2.94-.08-.02a1.7 1.7 0 0 0-1.73.5l-.06.07h-3.4l-.04-.08a1.7 1.7 0 0 0-1.4-1.06 1.7 1.7 0 0 0-1.52.56l-.06.06-2.94-1.7.02-.08a1.7 1.7 0 0 0-.5-1.73l-.07-.06v-3.4l.08-.04a1.7 1.7 0 0 0 1.06-1.4 1.7 1.7 0 0 0-.56-1.52l-.06-.06 1.7-2.94.08.02a1.7 1.7 0 0 0 1.73-.5l.06-.07h3.4l.04.08a1.7 1.7 0 0 0 1.4 1.06 1.7 1.7 0 0 0 1.52-.56l.06-.06 2.94 1.7-.02.08a1.7 1.7 0 0 0 .5 1.73l.07.06v3.4z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Tabs Navigation (hidden by default) -->
        <nav class="tabs-nav" id="tabs-nav" hidden>
            <button class="tab-btn tab-btn--home tab-btn--active" data-tab="console" title="Консоль">
                <svg class="tab-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span class="tab-btn__home-label">Консоль</span>
            </button>
            <!-- UI plugins tabs will be dynamically added here -->
        </nav>

        <!-- Tab Content: Console/Main -->
        <div class="tab-content tab-content--active" data-tab-content="console">
            <div class="workspace">
                <!-- Sidebar: Plugins -->
                <aside class="sidebar">
                    <div class="sidebar__header">
                        <h2 class="sidebar__title">Plugins</h2>
                    </div>
                    <div id="plugin-list" class="plugin-list">
                        <div class="plugin-list__empty">
                            Press <kbd>↻</kbd> to scan
                        </div>
                    </div>
                </aside>

                <!-- Main: Console -->
                <main class="main-content">
                    <div class="console">
                        <div class="console__header">
                            <h2 class="console__title">Console</h2>
                            <button id="btn-clear-log" class="btn btn--ghost btn--small">Clear</button>
                        </div>
                        <div id="log-output" class="log-output"></div>
                    </div>

                    <!-- Send Panel -->
                    <div class="send-panel" id="send-panel" hidden>
                        <div class="send-panel__header">
                            <span class="send-panel__plugin-name" id="send-panel-title"></span>
                        </div>

                        <!-- Generated from plugin.ui_schema -->
                        <div id="schema-form" class="schema-form">
                            <div id="schema-fields" class="schema-fields"></div>
                            <button id="btn-schema-submit" class="btn btn--primary" type="button">
                                Submit
                            </button>
                        </div>
                    </div>
                </main>
            </div>
        </div>
        <!-- End of Console Tab Content -->

        <!-- Task Manager Tab -->
        <div class="tab-content" data-tab-content="task-manager">
            <div class="task-manager">
                <div class="task-manager__header">
                    <h2 class="task-manager__title">Диспетчер задач</h2>
                    <div class="task-manager__stats">
                        <span class="stat"><span class="stat__label">Плагинов:</span> <span id="tm-total">0</span></span>
                        <span class="stat"><span class="stat__label">Активных:</span> <span id="tm-active">0</span></span>
                    </div>
                </div>
                <div class="task-manager__table">
                    <table class="tm-table">
                        <thead>
                            <tr>
                                <th>Плагин</th>
                                <th>Тип</th>
                                <th>Статус</th>
                                <th>Uptime</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="tm-tbody">
                            <tr>
                                <td colspan="5" class="tm-table__empty">Нет запущенных плагинов</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- UI Plugin Tabs Content (dynamically generated) -->
        <div id="ui-plugin-tabs"></div>

    </div>
